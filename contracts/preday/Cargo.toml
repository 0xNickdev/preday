[package]
name = "preday"
description = "Paycheck advances against on-chain income history"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
near-workspaces = { version = "0.24.0", features = ["unstable"] }
near-primitives = { version = "0.38.1", features = ["test_utils"] }
near-crypto = "0.38.1"
near-jsonrpc-client = "0.23.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
serde_json = "1"
anyhow = "1"
